# Servidor de desarrollo en AWS (spec nv-07). MongoDB vive en Atlas, Redis en Upstash y Neo4j en
# Aura (nv-11); aquí solo la API y Caddy. Todo vuelve solo tras un apagado.
# Lo sube scripts/desplegar.sh a /opt/wherever; .env lo arma scripts/deploy-env.sh.
name: wherever

services:
  api:
    image: ${API_IMAGE:-wherever-api:dev} # imagen.env la fija por digest (nv-08)
    env_file: .env
    ports:
      - "8080:8080" # el Security Group solo deja llegar desde tu IP; el público entra por Caddy
    restart: unless-stopped
    mem_limit: 192m

  caddy:
    image: caddy:2.10.2-alpine
    network_mode: host # 80 y 443 de la instancia; reenvía a 127.0.0.1:8080
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?falta SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # conserva el certificado entre apagados
      - caddy-config:/config
    restart: unless-stopped
    mem_limit: 64m

volumes:
  caddy-data:
  caddy-config:
