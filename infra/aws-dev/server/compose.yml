# Servidor de desarrollo en AWS (spec nv-07). MongoDB vive en Atlas; aquí solo la API, Redis,
# Neo4j y Caddy. Las bases no publican puertos; todo vuelve solo tras un apagado.
# Lo sube scripts/desplegar.sh a /opt/wherever; .env lo arma scripts/deploy-env.sh.
name: wherever

services:
  api:
    image: ${API_IMAGE:-wherever-api:dev} # imagen.env la fija por digest (nv-08)
    env_file: .env
    environment:
      REDIS_ADDR: redis:6379
      NEO4J_URI: neo4j://neo4j:7687
    ports:
      - "8080:8080" # el Security Group solo deja llegar desde tu IP; el público entra por Caddy
    depends_on: [redis, neo4j]
    restart: unless-stopped
    mem_limit: 192m

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    mem_limit: 96m

  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: "none" # sin puertos publicados: solo la API llega por la red de Compose
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 64m
    volumes:
      - neo4j-data:/data
    restart: unless-stopped
    mem_limit: 512m

  caddy:
    image: caddy:2.10.2-alpine
    network_mode: host # 80 y 443 de la instancia; reenvía a 127.0.0.1:8080
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?falta SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # conserva el certificado entre apagados
      - caddy-config:/config
    restart: unless-stopped
    mem_limit: 64m

volumes:
  redis-data:
  neo4j-data:
  caddy-data:
  caddy-config:
