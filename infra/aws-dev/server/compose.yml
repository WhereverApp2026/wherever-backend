# Servidor de desarrollo en AWS (spec nv-07). MongoDB vive en Atlas, Redis en Upstash y Neo4j en
# Aura (nv-11); aquí solo la API, y el HTTPS lo da CloudFront (nv-12). Todo vuelve solo tras un apagado.
# Lo sube scripts/instalar-actualizador.sh a /opt/wherever; .env lo arma scripts/deploy-env.sh.
name: wherever

services:
  api:
    image: ${API_IMAGE:-wherever-api:dev} # imagen.env la fija por digest (nv-08)
    env_file: .env
    ports:
      - "8080:8080" # el Security Group solo deja llegar al balanceador
    restart: unless-stopped
    mem_limit: 192m
    # nv-13. non-blocking: si CloudWatch no responde, la API arranca y atiende; pierde líneas, no peticiones.
    logging:
      driver: awslogs
      options:
        awslogs-region: ${LOG_REGION:?falta LOG_REGION}
        awslogs-group: /wherever/dev/api
        awslogs-stream: ${LOG_STREAM:?falta LOG_STREAM}
        mode: non-blocking
        max-buffer-size: 4m
