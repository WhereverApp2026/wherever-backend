# CI de PR (constitución §8). Orden vigente:
#   deps → build → unit → integration → security → critic → endpoints → sdd
#   → coverage → delta-check → mutation → semgrep
# database y contract se suman con el primer módulo que tenga índices y contrato.
# delta-check y mutation son advisory (nv-03): informan y nunca bloquean.
# Sin deploy.
name: ci-pr

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    # Testcontainers exige Linux (AGENTS.md §1).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # delta-check y mutation necesitan la historia para `git merge-base`.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod fija el mínimo (1.26, por Testcontainers); CI usa el último parche de 1.27
          # para que govulncheck no marque la librería estándar.
          go-version: "1.27.x"

      - name: deps
        run: go mod download

      - name: build
        run: |
          go build ./...
          go vet ./...

      - name: lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # Cada suite deja su perfil; coverage los une (constitución §7).
      - name: unit
        run: mkdir -p bin && go test ./internal/... ./cmd/... -count=1 $COVER -coverprofile=bin/coverage-unit.out
        env:
          COVER: -covermode=atomic -coverpkg=./internal/...,./cmd/...

      - name: integration
        run: go test ./tests/integration/... -count=1 -p 1 $COVER -coverprofile=bin/coverage-integration.out
        env:
          COVER: -covermode=atomic -coverpkg=./internal/...,./cmd/...

      - name: security
        run: go test ./tests/security/... -count=1 $COVER -coverprofile=bin/coverage-security.out
        env:
          COVER: -covermode=atomic -coverpkg=./internal/...,./cmd/...

      - name: critic
        run: bash scripts/critic-guardrails.sh

      - name: endpoints
        run: bash scripts/check_endpoints.sh

      - name: sdd
        run: bash scripts/check_sdd.sh

      - name: coverage
        run: bash scripts/check_coverage.sh --min 45 bin/coverage-unit.out bin/coverage-integration.out bin/coverage-security.out

      - name: delta-check
        continue-on-error: true
        run: |
          python3 -m unittest discover -s scripts -p "*_test.py"
          python3 scripts/check_delta_coverage.py --min 80 --advisory --base "origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}

      - name: mutation
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 15
        run: bash scripts/mutation.sh --base "origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}

      # Tras la mutación siempre se compila (AGENTS.md §4); este paso sí bloquea.
      - name: build tras mutation
        run: go build ./...

      - name: semgrep
        run: |
          python3 -m pip install --quiet semgrep==1.95.0
          semgrep scan --config=auto --config=.semgrep/semgrep.yaml --error

      - name: compose y docker build
        run: |
          docker compose -f deployments/docker-compose.yml config --quiet
          docker build --build-arg VERSION=${{ github.sha }} -t wherever-api:ci .
