# Corrida semanal (domingo; antes diaria, se cambió para ahorrar minutos de Actions): mutación completa (constitución §7: no bloquea), DAST con ZAP (nv-09) y fuzz (nv-10).
# Línea base medida en nv-04: score 0,62 (31 min en Windows). Límite: go-mutesting solo muta
# archivos con `_test.go` del mismo nombre (12 de 36 en internal/); el service de auth, que se
# prueba en tests/integration, no entra. Ver Memoria.md.
name: nightly

on:
  schedule:
    - cron: "0 9 * * 0" # domingo 03:00 en America/Mexico_City
  workflow_dispatch:
    inputs:
      solo:
        description: Correr solo un job, para probarlo sin esperar la mutación completa
        type: choice
        default: todo
        options: [todo, dast, fuzz]

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  mutation:
    if: ${{ !inputs.solo || inputs.solo == 'todo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"

      - name: deps
        run: go mod download

      - name: mutation completa
        run: bash scripts/mutation.sh --full

      - name: resumen
        if: always()
        run: |
          grep -E '^The mutation score' bin/mutation.log >> "$GITHUB_STEP_SUMMARY" || echo "sin score" >> "$GITHUB_STEP_SUMMARY"

  # La API corre con APP_ENV=staging y llaves de un solo uso: no hay secretos ni datos reales.
  dast-zap:
    if: ${{ !inputs.solo || inputs.solo == 'todo' || inputs.solo == 'dast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZAP: ghcr.io/zaproxy/zaproxy:2.17.0
      MONGO_URI: mongodb://localhost:27017/wherever
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"

      - name: bases
        run: docker compose -f deployments/docker-compose.yml up -d --wait

      - name: indices
        run: go run ./scripts/indexes

      - name: API
        run: |
          docker build --build-arg VERSION="$GITHUB_SHA" -t wherever-api:dast .
          JWT_KEY=$(openssl rand -base64 48)
          PHONE_HMAC_KEY=$(openssl rand -base64 48)
          CURSOR_HMAC_KEY=$(openssl rand -base64 48)
          export JWT_KEY PHONE_HMAC_KEY CURSOR_HMAC_KEY
          # REQUEST_TIMEOUT=10s: la sonda /probe/lenta (nv-12) espera 45 s y ZAP la toma del
          # OpenAPI; con 10 s responde su 408 antes de que ZAP corte la lectura y falle el plan.
          docker run -d --name api --network host \
            -e APP_ENV=staging -e PORT=8080 -e REQUEST_TIMEOUT=10s -e MONGO_URI -e REDIS_ADDR=localhost:6379 \
            -e NEO4J_URI=neo4j://localhost:7687 -e JWT_ISSUER=wherever-api -e JWT_AUDIENCE=wherever-app \
            -e JWT_KEY -e PHONE_HMAC_KEY -e CURSOR_HMAC_KEY \
            wherever-api:dast
          for _ in $(seq 1 30); do
            [[ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ready)" == "200" ]] && exit 0
            sleep 5
          done
          docker logs api
          exit 1

      - name: ZAP pasivo
        run: |
          mkdir -p zap-reporte
          chmod 777 zap-reporte
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" "$ZAP" zap.sh -cmd -port 8090 -autorun /zap/wrk/.zap/plan.yaml

      # Falla con alertas altas (riskcode 3), no con las medias ni las informativas.
      - name: alertas altas
        run: |
          altas="$(jq '[.site[]?.alerts[]? | select(.riskcode == "3")] | length' zap-reporte/zap.json)"
          total="$(jq '[.site[]?.alerts[]?] | length' zap-reporte/zap.json)"
          urls="$(jq '[.site[]?.alerts[]?.instances[]?.uri] | unique | length' zap-reporte/zap.json)"
          {
            echo "## ZAP (pasivo)"
            echo "Alertas altas: **$altas** de $total, en $urls URL distintas. Reporte en los artefactos."
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$altas" == "0" ]]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-reporte
          path: zap-reporte
          retention-days: 14
          if-no-files-found: warn

  # 60 s por objetivo y unos 15 min en total (nv-10). Un fallo deja su caso en testdata/fuzz:
  # se baja del artefacto, se versiona como semilla y se corrige en el mismo PR.
  fuzz:
    if: ${{ !inputs.solo || inputs.solo == 'todo' || inputs.solo == 'fuzz' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"

      - name: objetivos de fuzz
        run: bash scripts/ci/fuzz.sh 60s bin/fuzz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz
          path: |
            bin/fuzz
            **/testdata/fuzz/**
          retention-days: 14
          if-no-files-found: warn
