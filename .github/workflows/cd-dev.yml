# CD del entorno de desarrollo (spec nv-08). Publica la imagen en GHCR con SBOM y provenance, la firma
# con cosign sin llaves y mueve `dev`; el servidor la detecta, verifica la firma y se instala sola
# (wherever-actualizar.timer). GitHub no tiene ningún acceso a AWS.
name: cd-dev

on:
  workflow_run:
    workflows: [ci-pr]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: SHA completo de main al que regresar
        required: true
        type: string

# Cada job pide solo lo suyo; id-token (OIDC para cosign) solo lo tiene `firmar`.
permissions: {}

# Uno a la vez; el siguiente espera sin cancelar al que está en curso.
concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/whereverapp2026/wherever-backend
  COSIGN_RELEASE: v3.1.4
  # Identidad que exige la firma, aquí y en actualizar.sh: este workflow, desde main.
  FIRMA_IDENTIDAD: ^https://github\.com/WhereverApp2026/wherever-backend/\.github/workflows/cd-dev\.yml@refs/heads/main$
  FIRMA_EMISOR: https://token.actions.githubusercontent.com

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      sha: ${{ steps.entrada.outputs.sha }}
      digest: ${{ steps.imagen.outputs.digest }}
    steps:
      - name: validar sha
        id: entrada
        env:
          INPUT_SHA: ${{ inputs.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="${INPUT_SHA:-$HEAD_SHA}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::el sha debe tener 40 caracteres hexadecimales en minúscula"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.entrada.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # El driver docker-container admite atestaciones (SBOM y provenance); el de docker no siempre.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}

      - name: entrar a GHCR
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Con SBOM y provenance la etiqueta apunta a un índice OCI (imagen + atestaciones); el digest
      # que se firma y que instalan los servidores es el de ese índice. Volver a ejecutar un SHA ya
      # firmado no reconstruye. Uno sin firma válida (anterior a la firma, o con la firma a medias) o
      # incompleto se reconstruye, y solo si ese SHA pertenece a main: nunca se firma a posteriori lo
      # que no se construyó en esta ejecución. El checkout con fetch-depth 0 ya trae origin/main.
      - name: publicar imagen del sha
        id: imagen
        env:
          SHA: ${{ steps.entrada.outputs.sha }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:$SHA" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || true)"
          if [[ -n "$digest" ]] &&
            docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}' >/dev/null 2>&1 &&
            cosign verify --certificate-identity-regexp "$FIRMA_IDENTIDAD" \
              --certificate-oidc-issuer "$FIRMA_EMISOR" "$IMAGE@$digest" >/dev/null 2>&1; then
            echo "la imagen $SHA ya existe firmada ($digest); no se reconstruye"
          else
            if [[ -n "$digest" ]]; then
              echo "::notice::la imagen $SHA existe sin firma válida o incompleta; se reconstruye"
            fi
            if ! git merge-base --is-ancestor "$SHA" origin/main; then
              echo "::error::$SHA no es ancestro de main"
              exit 1
            fi
            docker buildx build --provenance=mode=max --sbom=true --push \
              --metadata-file build.json \
              --build-arg VERSION="$SHA" \
              --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.revision="$SHA" \
              -t "$IMAGE:$SHA" .
            digest="$(jq -r '."containerimage.digest" // empty' build.json)"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no se pudo leer el digest de $IMAGE:$SHA"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Firma sin llaves: el certificado de Fulcio lleva la identidad de este workflow (OIDC de GitHub)
  # y queda registrado en Rekor. Siempre por digest, nunca por etiqueta.
  firmar:
    needs: publicar
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}

      - name: entrar a GHCR
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: firmar el digest
        env:
          DIGEST: ${{ needs.publicar.outputs.digest }}
        run: |
          ref="$IMAGE@$DIGEST"
          if cosign verify --certificate-identity-regexp "$FIRMA_IDENTIDAD" \
            --certificate-oidc-issuer "$FIRMA_EMISOR" "$ref" >/dev/null 2>&1; then
            echo "$ref ya está firmada; no se vuelve a firmar"
            exit 0
          fi
          cosign sign --yes "$ref"

  desplegar:
    needs: [publicar, firmar]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}

      - name: entrar a GHCR
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # La misma comprobación que hará cada servidor; si falla aquí, `dev` no se mueve.
      - name: comprobar la firma
        env:
          DIGEST: ${{ needs.publicar.outputs.digest }}
        run: |
          cosign verify --certificate-identity-regexp "$FIRMA_IDENTIDAD" \
            --certificate-oidc-issuer "$FIRMA_EMISOR" "$IMAGE@$DIGEST" >/dev/null

      # Con un solo índice de origen, imagetools lo copia tal cual: `dev` queda en el mismo digest
      # firmado. Si no fuera así, los servidores rechazarían `dev`; por eso se comprueba.
      - name: mover la etiqueta dev
        env:
          DIGEST: ${{ needs.publicar.outputs.digest }}
        run: |
          docker buildx imagetools create -t "$IMAGE:dev" "$IMAGE@$DIGEST"
          dev="$(docker buildx imagetools inspect "$IMAGE:dev" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [[ "$dev" != "$DIGEST" ]]; then
            echo "::error::dev quedó en $dev y no en el digest firmado $DIGEST"
            exit 1
          fi

      # Cada publicación crea de 4 a 5 versiones en GHCR: el índice, la imagen, la atestación y la
      # firma (con su índice de referencias si GHCR no tiene la API de referrers). 40 son al menos 8
      # despliegues. El corte cuenta versiones sueltas: al más viejo puede faltarle una pieza; un
      # regreso a ese SHA lo detecta y lo reconstruye.
      - name: conservar los últimos despliegues
        if: github.event_name == 'workflow_run'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: wherever-backend
          package-type: container
          min-versions-to-keep: 40

      # Tabla de spec nv-08 §Contratos. Con dos instancias (nv-12), A instala en unos 3 minutos y B al
      # menos 5 después. Varias lecturas seguidas con el SHA: el balanceador reparte entre las dos.
      - name: comprobar el servidor
        env:
          SHA: ${{ needs.publicar.outputs.sha }}
          API_URL: ${{ vars.API_URL }}
        run: |
          if [[ -z "$API_URL" ]]; then
            echo "::error::falta la variable del repositorio API_URL"
            exit 1
          fi
          hora="$(TZ=America/Mexico_City date +%H%M)"
          if ((10#$hora >= 2150 && 10#$hora < 2200)); then
            echo "::notice::ventana de apagado: el servidor se actualizará al encender a las 08:00"
            exit 0
          fi
          vio_instancia=false
          codigo=000
          version=""
          seguidas=0
          limite=$((SECONDS + 720))
          while ((SECONDS < limite)); do
            codigo="$(curl -s -o health.json -w '%{http_code}' --max-time 10 "$API_URL/health" || true)"
            version=""
            if [[ "$codigo" == "200" ]]; then
              vio_instancia=true
              version="$(jq -r '.version // ""' health.json || true)"
            fi
            if [[ "$version" == "$SHA" ]]; then
              seguidas=$((seguidas + 1))
              if ((seguidas >= 5)); then
                echo "el servidor ya sirve $SHA en 5 lecturas seguidas"
                exit 0
              fi
              sleep 3
            else
              seguidas=0
              sleep 15
            fi
          done
          # CloudFront y el balanceador siempre responden: con todo apagado solo hay 5xx.
          if [[ "$vio_instancia" == "false" && ( "$codigo" == 000 || "$codigo" == 5* ) ]]; then
            echo "::notice::ninguna instancia respondió: si están apagadas, se actualizarán al encender"
            exit 0
          fi
          if [[ "$codigo" != "200" ]]; then
            echo "::error::/health respondió $codigo tras 12 minutos"
            exit 1
          fi
          echo "::error::el servidor sigue en $version y no en $SHA: revisa si regresó o rechazó la firma (failed_digest) o si venció GHCR_TOKEN"
          exit 1
